# Pytest configuration for i.MX RT1180 integration tests
#
# Usage:
#   cd tests/integration
#   pytest -v test_enet.py

[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeouts in seconds
timeout = 60

# Markers
markers =
    slow: tests that take >10 seconds
    network: tests requiring network backend
    enet: ENET peripheral tests
    phy: DP83822 PHY tests
    lwip: lwIP protocol stack tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
